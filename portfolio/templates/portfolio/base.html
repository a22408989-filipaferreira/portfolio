{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link rel="stylesheet" href="{% static 'escola/styles.css' %}">
</head>
<body>

<header>
    <h1>Portfolio</h1>
    <nav>
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'projects' %}">Projects</a>
        <a href="{% url 'skills' %}">Skills</a>
        <a href="{% url 'techs' %}">Techs</a>
        <a href="{% url 'courses' %}">Courses</a>
        <a href="{% url 'navigation_map' %}">Navigation Map</a>
        <a href="{% url 'github' %}">GitHub</a>
        <a href="{% url 'making_of' %}">Making-Of</a>
        <a href="{% url 'articles' %}">Articles</a>

        {% if user.is_authenticated %}
            <span class="nav-user">Olá, {{ user.username }}</span>

            <form method="post" action="{% url 'logout' %}" class="logout-form">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>&copy; 2026</p>
</footer>

</body>
</html>
