{% extends "portfolio/base.html" %}

{% block content %}

<h2>Skills</h2>

<a href="{% url 'skill_create' %}" class="create-btn">Criar nova competência</a>

<section>
    {% for skill in skills %}
        <article>
            <h3>{{ skill.name }}</h3>
            <p>{{ skill.description }}</p>
            <p><strong>Level:</strong> {{ skill.level }}</p>

            <a href="{% url 'skill_edit' skill.id %}" class="action-btn edit-btn">Editar</a>
            <a href="{% url 'skill_delete' skill.id %}" class="action-btn delete-btn">Apagar</a>
        </article>
    {% endfor %}
</section>

{% endblock %}
