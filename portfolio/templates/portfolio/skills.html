{% extends "portfolio/base.html" %}

{% block content %}

<h2>Skills</h2>

<section>
    {% for skill in skills %}
        <article>
            <h3>{{ skill.name }}</h3>
            <p>{{ skill.description }}</p>
            <p><strong>Level:</strong> {{ skill.level }}</p>
        </article>
    {% endfor %}
</section>

{% endblock %}
