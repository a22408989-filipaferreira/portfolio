{% extends "portfolio/base.html" %}

{% block content %}

<div class="form-container">

    <h1>{{ title }}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="form-btn save-btn">
            Guardar
        </button>

        <a href="{% url back_url %}" class="form-btn cancel-btn">
            Voltar
        </a>

    </form>

</div>

{% endblock %}
