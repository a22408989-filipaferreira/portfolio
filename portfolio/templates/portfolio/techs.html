{% extends "portfolio/base.html" %}

{% block content %}

<h2>Technologies</h2>

<a href="{% url 'tech_create' %}" class="create-btn">Criar nova tecnologia</a>

<section>
    {% for tech in techs %}
        <article>
            <h3>{{ tech.name }}</h3>

            {% if tech.logo %}
                <img src="{{ tech.logo.url }}" width="100">
            {% endif %}

            <p>{{ tech.description }}</p>

            {% if tech.website %}
                <a href="{{ tech.website }}">Website</a>
            {% endif %}

            <a href="{% url 'tech_edit' tech.id %}" class="action-btn edit-btn">Editar</a>
            <a href="{% url 'tech_delete' tech.id %}" class="action-btn delete-btn">Apagar</a>
        </article>
    {% endfor %}
</section>

{% endblock %}
