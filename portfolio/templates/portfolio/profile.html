{% extends "portfolio/base.html" %}

{% block content %}

<h2>{{ profile.name }}</h2>

{% if profile.photo %}
    <img src="{{ profile.photo.url }}" width="150">
{% endif %}

<p>{{ profile.bio }}</p>

<p><strong>Email:</strong> {{ profile.email }}</p>

{% if profile.website %}
<p><a href="{{ profile.website }}">Website</a></p>
{% endif %}

{% endblock %}
