{% extends "portfolio/base.html" %}

{% block content %}

<div class="form-container">
    <h1>Login por Link Mágico</h1>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Email</label>
        <input type="email" name="email" required>

        <button type="submit" class="form-btn save-btn">
            Enviar link mágico
        </button>

        <a href="{% url 'login' %}" class="form-btn cancel-btn">
            Voltar ao login
        </a>
    </form>
</div>

{% endblock %}
